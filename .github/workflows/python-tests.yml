name: Python tests

on:
  push:
  pull_request:

jobs:
  native:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@stable
      - name: Build C, C++ and Rust helpers
        run: make -C native
      - name: Run Rust unit tests
        run: cargo test --release --manifest-path native/rust/Cargo.toml
      - name: Compare native engines with Python fallbacks
        env:
          GARBAGE_NATIVE_DIR: ${{ github.workspace }}/native/build
        run: python -m unittest tests.test_native -v

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.10", "3.14"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run standard-library tests
        run: python -m unittest discover -s tests -v
      - name: Smoke-test POSIX launcher
        if: runner.os != 'Windows'
        run: ./scripts/run.sh doctor
      - name: Smoke-test PowerShell launcher
        if: runner.os == 'Windows'
        shell: pwsh
        run: .\scripts\run.ps1 doctor
