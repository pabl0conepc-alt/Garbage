<!doctype html>
<html lang="pt-BR" data-theme="dark" data-density="comfortable" data-reduce-motion="false">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#0B0C0E">
    <title>GARBAGE | Estação de inteligência</title>
    <link rel="icon" type="image/png" sizes="64x64" href="/favicon.png">
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <link rel="stylesheet" href="/style.css">
    <script src="/app.js" defer></script>
    <script src="/views.js" defer></script>
    <script src="/views-intel.js" defer></script>
    <script src="/views-system.js" defer></script>
    <script src="/views-file.js" defer></script>
    <script src="/views-multisearch.js" defer></script>
    <script src="/board.js" defer></script>
    <script src="/graph.js" defer></script>
  </head>
  <body>
    <a class="skip-link" href="#main-content">Pular para o conteúdo</a>
    <div class="app-shell">
      <aside class="sidebar rail" id="sidebar" aria-label="Navegação principal">
        <div class="sidebar-head">
          <a class="brand" href="#/overview" aria-label="GARBAGE — visão geral" data-tooltip="GARBAGE — Visão geral">
            <img class="brand-logo" src="/logo-mark.png" alt="" width="30" height="31">
            <span class="brand-copy"><strong>GARBAGE</strong><small>Estação de inteligência</small></span>
          </a>
          <button class="icon-button sidebar-close" id="sidebar-close" type="button" aria-label="Fechar navegação" data-icon="close"></button>
        </div>
        <nav id="nav-groups" class="nav-groups" aria-label="Módulos do workspace"></nav>
        <div class="sidebar-bottom">
          <button class="rail-button sidebar-shortcut" id="shortcuts-button" type="button"
                  aria-label="Atalhos de teclado" data-tooltip="Atalhos de teclado" data-icon="keyboard">
            <span class="nav-label">Atalhos de teclado</span>
          </button>
          <span class="rail-local" tabindex="0" role="note" aria-label="Workspace local: os dados permanecem nesta máquina. Observações são registradas pelo analista e não verificadas de forma independente."
                data-tooltip="Workspace local — os dados permanecem nesta máquina. Observações são registradas pelo analista e não verificadas de forma independente.">
            <span class="live-dot" aria-hidden="true"></span>
            <span class="nav-label">Somente local</span>
          </span>
        </div>
      </aside>

      <main class="main-shell" id="main-content" tabindex="-1">
        <header class="topbar">
          <div class="topbar-start">
            <button class="icon-button mobile-nav-toggle" id="mobile-nav-toggle" type="button"
                    aria-label="Abrir navegação" aria-expanded="false" aria-controls="sidebar" data-icon="menu"></button>
            <nav class="breadcrumb" aria-label="Localização">
              <span class="breadcrumb-root" id="breadcrumb-group">Workspace</span>
              <span class="breadcrumb-sep" aria-hidden="true">/</span>
              <strong id="page-breadcrumb" aria-current="page">Visão geral</strong>
            </nav>
          </div>
          <div class="topbar-actions">
            <button class="search-trigger" id="global-search-button" type="button" aria-label="Pesquisar no workspace e executar comandos">
              <span class="search-trigger-icon" data-icon="search" aria-hidden="true"></span>
              <span class="search-trigger-label">Pesquisar ou executar comando</span>
              <kbd>Ctrl K</kbd>
            </button>
            <span class="local-indicator" data-tooltip="O servidor escuta apenas em loopback (127.0.0.1). Nada sai desta máquina." tabindex="0">
              <span class="live-dot" aria-hidden="true"></span> Local
            </span>
            <div class="display-wrap">
              <button class="icon-button display-toggle" id="display-toggle" type="button"
                      aria-label="Preferências de exibição" aria-expanded="false" aria-haspopup="true"
                      data-tooltip="Preferências de exibição" data-icon="display"></button>
              <div class="display-menu" id="display-menu" hidden></div>
            </div>
            <button class="button button-primary button-small" id="new-investigation-button" type="button" aria-label="Nova investigação" data-tooltip="Nova investigação (N)">
              <span data-icon="plus" aria-hidden="true"></span><span class="new-case-label">Nova investigação</span>
            </button>
          </div>
        </header>

        <div id="status" class="toast" role="status" aria-live="polite" aria-atomic="true"></div>
        <div id="loading-state" class="loading-bar" aria-hidden="true"></div>
        <div id="view-root" class="view-root" tabindex="-1"></div>
      </main>
    </div>

    <div id="tooltip" class="tooltip" role="tooltip" hidden></div>

    <dialog id="search-dialog" class="command-dialog" aria-label="Pesquisa e comandos do workspace">
      <div class="command-header">
        <span class="command-icon" data-icon="search" aria-hidden="true"></span>
        <input id="global-search-input" type="search" autocomplete="off" spellcheck="false"
               placeholder="Pesquisar registros ou executar um comando…"
               aria-label="Pesquisar registros ou executar um comando">
        <kbd>ESC</kbd>
      </div>
      <div id="global-search-results" class="command-results"></div>
      <footer class="command-footer">
        <span>↑ ↓ navegar</span>
        <span>↵ executar</span>
        <span>? atalhos</span>
        <span>Somente registros locais</span>
      </footer>
    </dialog>

    <div class="nav-backdrop" id="nav-backdrop" aria-hidden="true"></div>

    <noscript>
      <div class="noscript">O GARBAGE requer JavaScript. A API local e o banco de dados continuam disponíveis pela CLI.</div>
    </noscript>
  </body>
</html>
