<!doctype html>
<html lang="en" data-theme="dark" data-density="comfortable" data-reduce-motion="false">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#0a0e14">
    <title>GARBAGE | Intelligence workstation</title>
    <link rel="stylesheet" href="/style.css">
    <script src="/app.js" defer></script>
    <script src="/views.js" defer></script>
    <script src="/views-intel.js" defer></script>
    <script src="/views-system.js" defer></script>
    <script src="/views-file.js" defer></script>
    <script src="/board.js" defer></script>
    <script src="/graph.js" defer></script>
  </head>
  <body>
    <div class="app-shell">
      <aside class="sidebar" aria-label="Primary navigation">
        <a class="brand" href="#/overview" aria-label="GARBAGE overview">
          <span class="brand-mark" aria-hidden="true">G</span>
          <span class="brand-copy"><strong>GARBAGE</strong><small>INTELLIGENCE WORKSTATION</small></span>
        </a>
        <nav id="nav-groups" class="nav-groups" aria-label="Workspace modules"></nav>
        <div class="sidebar-bottom">
          <div class="local-card">
            <span class="live-dot" aria-hidden="true"></span>
            <div><strong>Local workspace</strong><small>Data stays on this machine</small></div>
          </div>
          <p class="sidebar-footnote">Observations are analyst-recorded and not independently verified.</p>
        </div>
      </aside>

      <main class="main-shell">
        <header class="topbar">
          <div class="breadcrumb">
            <span class="breadcrumb-root">WORKSPACE</span>
            <span aria-hidden="true">/</span>
            <strong id="page-breadcrumb">Overview</strong>
          </div>
          <div class="topbar-actions">
            <button class="search-trigger" id="global-search-button" type="button" aria-label="Search workspace">
              <span aria-hidden="true">⌕</span>
              <span class="search-trigger-label">Search workspace</span>
              <kbd>Ctrl K</kbd>
            </button>
            <span class="local-indicator"><span class="live-dot" aria-hidden="true"></span> LOCAL ONLY</span>
            <button class="button button-primary button-small" id="new-investigation-button" type="button">＋ New investigation</button>
          </div>
        </header>

        <div id="status" class="toast" role="status" aria-live="polite"></div>
        <div id="loading-state" class="loading-bar" aria-hidden="true"></div>
        <div id="view-root" class="view-root" tabindex="-1"></div>
      </main>
    </div>

    <dialog id="search-dialog" class="command-dialog" aria-label="Workspace search">
      <div class="command-header">
        <span class="command-icon" aria-hidden="true">⌕</span>
        <input id="global-search-input" type="search" autocomplete="off" spellcheck="false"
               placeholder="Search investigations, entities, evidence, sources, indicators…"
               aria-label="Search investigations, entities, evidence, sources and indicators">
        <kbd>ESC</kbd>
      </div>
      <div id="global-search-results" class="command-results"></div>
      <footer class="command-footer">
        <span>↑ ↓ navigate</span>
        <span>↵ open</span>
        <span>Local records only</span>
      </footer>
    </dialog>

    <noscript>
      <div class="noscript">GARBAGE requires JavaScript. The local API and database remain available through the CLI.</div>
    </noscript>
  </body>
</html>
