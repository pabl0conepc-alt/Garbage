<!doctype html>
<html lang="pt-BR" data-theme="dark" data-density="comfortable" data-reduce-motion="false">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#F1F1F3">
    <title>GARBAGE | Estação de inteligência</title>
    <link rel="icon" type="image/png" sizes="64x64" href="/favicon.png">
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <link rel="stylesheet" href="/style.css">
    <script src="/app.js" defer></script>
    <script src="/charts.js" defer></script>
    <script src="/views.js" defer></script>
    <script src="/views-intel.js" defer></script>
    <script src="/views-system.js" defer></script>
    <script src="/views-yara.js" defer></script>
    <script src="/image-hash.js" defer></script>
    <script src="/views-file.js" defer></script>
    <script src="/street-map.js" defer></script>
    <script src="/views-multisearch.js" defer></script>
    <script src="/board.js" defer></script>
    <script src="/graph-layouts.js" defer></script>
    <script src="/graph-views.js" defer></script>
    <script src="/graph-tools.js" defer></script>
    <script src="/graph.js" defer></script>
    <script src="/views-analytics.js" defer></script>
    <script src="/views-attack.js" defer></script>
    <script src="/views-transforms.js" defer></script>
    <script src="/views-ai.js" defer></script>
    <script src="/views-compare.js" defer></script>
    <script src="/views-geoint.js" defer></script>
    <script src="/views-feeds.js" defer></script>
    <script src="/views-actors.js" defer></script>
    <script src="/views-monitors.js" defer></script>
    <script src="/assistant.js" defer></script>
  </head>
  <body>
    <a class="skip-link" href="#main-content">Pular para o conteúdo</a>
    <div class="app-shell">
      <aside class="sidebar rail" id="sidebar" aria-label="Navegação principal">
        <div class="sidebar-head">
          <a class="brand" href="#/overview" aria-label="GARBAGE — visão geral" data-tooltip="GARBAGE — Visão geral">
            <img class="brand-logo" src="/logo-mark.png" alt="" width="30" height="31">
            <span class="brand-copy"><strong>GARBAGE</strong></span>
          </a>
          <button class="icon-button sidebar-close" id="sidebar-close" type="button" aria-label="Fechar navegação" data-icon="close"></button>
        </div>
        <button class="rail-button rail-search" id="global-search-button" type="button"
                aria-label="Pesquisar e executar comandos (Ctrl K)" data-tooltip="Pesquisar e comandos · Ctrl K" data-icon="search">
          <span class="nav-label">Pesquisar</span>
        </button>
        <nav id="nav-groups" class="nav-groups" aria-label="Módulos do workspace"></nav>
        <div class="sidebar-bottom">
          <div class="display-wrap notify-wrap" id="notify-wrap" hidden>
            <button class="rail-button notify-toggle" id="notify-toggle" type="button"
                    aria-label="Notificações de monitoramento" aria-expanded="false" aria-haspopup="true"
                    data-tooltip="Notificações" data-icon="bell"><span class="nav-label">Notificações</span></button>
            <span class="notify-count" id="notify-count" hidden></span>
            <div class="display-menu notify-menu" id="notify-menu" hidden></div>
          </div>
          <div class="display-wrap">
            <button class="rail-button display-toggle" id="display-toggle" type="button"
                    aria-label="Preferências de exibição" aria-expanded="false" aria-haspopup="true"
                    data-tooltip="Exibição" data-icon="display"><span class="nav-label">Exibição</span></button>
            <div class="display-menu" id="display-menu" hidden></div>
          </div>
          <div class="nav-bottom" id="nav-bottom"></div>
          <span class="rail-local" tabindex="0" role="note" aria-label="Workspace local: os dados permanecem nesta máquina."
                data-tooltip="Somente local — os dados permanecem nesta máquina.">
            <span class="live-dot" aria-hidden="true"></span>
            <span class="nav-label">Somente local</span>
          </span>
        </div>
      </aside>

      <main class="main-shell" id="main-content" tabindex="-1">
        <button class="icon-button mobile-nav-toggle" id="mobile-nav-toggle" type="button"
                aria-label="Abrir navegação" aria-expanded="false" aria-controls="sidebar" data-icon="menu"></button>
        <div id="status" class="toast" role="status" aria-live="polite" aria-atomic="true"></div>
        <div id="loading-state" class="loading-bar" aria-hidden="true"></div>
        <div id="area-tabs-host" class="area-tabs-host"></div>
        <div id="view-root" class="view-root" tabindex="-1"></div>
      </main>
    </div>

    <div id="tooltip" class="tooltip" role="tooltip" hidden></div>

    <dialog id="search-dialog" class="command-dialog" aria-label="Pesquisa e comandos do workspace">
      <div class="command-header">
        <span class="command-icon" data-icon="search" aria-hidden="true"></span>
        <input id="global-search-input" type="search" autocomplete="off" spellcheck="false"
               placeholder="Pesquisar registros ou executar um comando…"
               aria-label="Pesquisar registros ou executar um comando">
        <kbd>ESC</kbd>
      </div>
      <div id="global-search-results" class="command-results"></div>
      <footer class="command-footer">
        <span>↑ ↓ navegar</span>
        <span>↵ executar</span>
        <span>? atalhos</span>
        <span>Somente registros locais</span>
      </footer>
    </dialog>

    <div class="nav-backdrop" id="nav-backdrop" aria-hidden="true"></div>

    <noscript>
      <div class="noscript">O GARBAGE requer JavaScript. A API local e o banco de dados continuam disponíveis pela CLI.</div>
    </noscript>
  </body>
</html>
